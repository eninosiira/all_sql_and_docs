<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="430" viewBox="0 0 1500 430" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="42" font-size="24" font-weight="bold" fill="#1B2A3A">The Nielsen broadcast day: 6:00a to 5:59a, clock 0600–2959</text>
<text x="40" y="68" font-size="14" fill="#5B7A99">Hours after midnight keep counting (2400 = 12:00a, 2959 = 5:59a) so one BROADCAST_DATE holds the whole night. CALENDAR_DATE is never used.</text>
