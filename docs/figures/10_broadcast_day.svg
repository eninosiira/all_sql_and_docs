<rect x="405.0" y="344" width="230.0" height="30" rx="5" fill="#F3F0F8" stroke="#8E5BA6"/><text x="413.0" y="364" font-size="12" fill="#1B2A3A">12P-4P</text>
<rect x="635.0" y="344" width="230.0" height="30" rx="5" fill="#F3F0F8" stroke="#8E5BA6"/><text x="643.0" y="364" font-size="12" fill="#1B2A3A">4P-8P</text>
<text x="40" y="410" font-size="13" fill="#5B7A99">BCAST_START_MIN / BCAST_END_MIN are minutes since 6:00a, precomputed in the tables so no query does string time arithmetic. A telecast that straddles midnight stays on one date.</text>
</svg>